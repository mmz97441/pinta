name: Vérifier Expedîle

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pinta
    env:
      VITE_SUPABASE_URL: https://pinta-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: pinta-ci-public-placeholder
      PINTA_TEST_OUT: /tmp/pinta-browser-results
      PINTA_A11Y_OUT: /tmp/pinta-accessibility-results
      PINTA_UX_DEVIS_OUT: /tmp/pinta-devis-results
      PINTA_UX_TEAM_OUT: /tmp/pinta-team-results
      PINTA_PDF_OUT: /tmp/pinta-pdf-results
      PINTA_RECEPTION_DEVIS_OUT: /tmp/pinta-reception-devis-results
      PINTA_CARTONS_OUT: /tmp/pinta-received-cartons-results
      PINTA_NUMBERING_OUT: /tmp/pinta-carton-numbering-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pinta/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/customs/extract-reunion-tariff.test.mjs
      - run: node scripts/customs/build-seed.mjs --check
      - run: npm run build
      - run: node --test supabase/tests/*.test.cjs
      - name: Migrations, permissions et cohérence des calculs
        run: |
          docker run --rm -d --name pinta-finalisation-db --network none -e POSTGRES_PASSWORD=pinta-local-test-only postgres:17-alpine
          trap 'docker stop pinta-finalisation-db' EXIT
          ./supabase/tests/run-migrations.sh
          ./supabase/tests/run-regressions.sh
          ./supabase/tests/run-conversations.sh
          ./supabase/tests/run-document-work-guards.sh
          sh ./supabase/tests/run-staff-work-actions.sh
          ./supabase/tests/run-reminder-activation.sh
          node supabase/tests/quote-parity.mjs
          PINTA_DB_CONTAINER=pinta-finalisation-db ./supabase/tests/run-compatibility.sh
          ./supabase/tests/run-legacy-payments.sh
          ./supabase/tests/run-migration-owners.sh
          ./supabase/tests/run-telegram-requested-invoice.sh
          ./supabase/tests/run-invoice-review.sh
          ./supabase/tests/run-admin-simplification.sh
          sh ./supabase/tests/run-customs-quote.sh
          sh ./supabase/tests/run-task-corrections.sh
          sh ./supabase/tests/run-task-readiness.sh
          sh ./supabase/tests/run-team-task-start.sh
          sh ./supabase/tests/run-task-owner-guards.sh
          sh ./supabase/tests/run-quote-edit-guards.sh
          sh ./supabase/tests/run-reception-dates.sh
          sh ./supabase/tests/run-payment-return.sh
          sh ./supabase/tests/run-reception-append.sh
          sh ./supabase/tests/run-invoice-quote-rules.sh
          sh ./supabase/tests/run-departure-any-step.sh
          sh ./supabase/tests/run-consent-reply.sh
          sh ./supabase/tests/run-consent-relance-followup.sh
          sh ./supabase/tests/run-client-required-fields.sh
          sh ./supabase/tests/run-client-planned-departure.sh
      - run: npx playwright install --with-deps chromium
      - name: Parcours navigateur sans services externes
        run: |
          npm run preview -- --host 127.0.0.1 --port 4175 > /tmp/pinta-preview.log 2>&1 &
          pinta_preview_pid=$!
          trap 'kill "$pinta_preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          # Every suite runs; the step fails at the end with the list of failed suites.
          failed_suites=""
          node tests/browser-staff-sync.cjs || failed_suites="$failed_suites browser-staff-sync.cjs"
          node tests/payment-return.browser.cjs || failed_suites="$failed_suites payment-return.browser.cjs"
          node tests/dossier-list-contrast.browser.cjs || failed_suites="$failed_suites dossier-list-contrast.browser.cjs"
          node tests/dossier-table.browser.cjs || failed_suites="$failed_suites dossier-table.browser.cjs"
          node tests/dossier-table-comfort.browser.cjs || failed_suites="$failed_suites dossier-table-comfort.browser.cjs"
          PINTA_DOSSIER_DEPARTURES_OUT=/tmp/pinta-dossier-departures node tests/dossier-departures.browser.cjs || failed_suites="$failed_suites dossier-departures.browser.cjs"
          PINTA_DOSSIER_ACCORDS_OUT=/tmp/pinta-dossier-accords node tests/dossier-accords.browser.cjs || failed_suites="$failed_suites dossier-accords.browser.cjs"
          PINTA_DEPARTURES_PAGE_OUT=/tmp/pinta-departures-page node tests/departures-page.browser.cjs || failed_suites="$failed_suites departures-page.browser.cjs"
          node tests/parcel-reference-search.cjs || failed_suites="$failed_suites parcel-reference-search.cjs"
          node tests/reçu-documents-factures.cjs || failed_suites="$failed_suites reçu-documents-factures.cjs"
          node tests/invoice-review-indicator.cjs || failed_suites="$failed_suites invoice-review-indicator.cjs"
          node tests/invoice-workspace.cjs || failed_suites="$failed_suites invoice-workspace.cjs"
          node tests/invoice-completion.browser.cjs || failed_suites="$failed_suites invoice-completion.browser.cjs"
          node tests/invoice-quote-withdrawal.browser.cjs || failed_suites="$failed_suites invoice-quote-withdrawal.browser.cjs"
          node tests/client-late-invoice.browser.cjs || failed_suites="$failed_suites client-late-invoice.browser.cjs"
          node tests/preparation-autonomous.browser.cjs || failed_suites="$failed_suites preparation-autonomous.browser.cjs"
          node tests/task-flow.browser.cjs || failed_suites="$failed_suites task-flow.browser.cjs"
          node tests/task-readiness.browser.cjs || failed_suites="$failed_suites task-readiness.browser.cjs"
          node tests/task-back-navigation.browser.cjs || failed_suites="$failed_suites task-back-navigation.browser.cjs"
          node tests/shipment-revision.browser.cjs || failed_suites="$failed_suites shipment-revision.browser.cjs"
          node tests/quote-task-conflict.browser.cjs || failed_suites="$failed_suites quote-task-conflict.browser.cjs"
          node tests/customs-quote.browser.cjs || failed_suites="$failed_suites customs-quote.browser.cjs"
          node tests/dossier-shell.browser.cjs || failed_suites="$failed_suites dossier-shell.browser.cjs"
          node tests/parcours-dossier.browser.cjs || failed_suites="$failed_suites parcours-dossier.browser.cjs"
          node tests/dossier-overview.browser.cjs || failed_suites="$failed_suites dossier-overview.browser.cjs"
          node tests/conversation-layout.browser.cjs || failed_suites="$failed_suites conversation-layout.browser.cjs"
          PINTA_CONVERSATIONS_OUT=/tmp/pinta-conversations node tests/conversations-inbox.browser.cjs || failed_suites="$failed_suites conversations-inbox.browser.cjs"
          node tests/reception-page.browser.cjs || failed_suites="$failed_suites reception-page.browser.cjs"
          node tests/personal-work.browser.cjs || failed_suites="$failed_suites personal-work.browser.cjs"
          PINTA_WORK_LAYOUT_OUT=/tmp/pinta-work-layout node tests/work-layout.browser.cjs || failed_suites="$failed_suites work-layout.browser.cjs"
          node tests/task-claim.browser.cjs || failed_suites="$failed_suites task-claim.browser.cjs"
          node tests/collaborative-work.browser.cjs || failed_suites="$failed_suites collaborative-work.browser.cjs"
          node tests/reception-without-notification.browser.cjs || failed_suites="$failed_suites reception-without-notification.browser.cjs"
          node tests/client-lightweight.browser.cjs || failed_suites="$failed_suites client-lightweight.browser.cjs"
          node tests/task-message.browser.cjs || failed_suites="$failed_suites task-message.browser.cjs"
          PINTA_WORKSPACE_OUT=/tmp/pinta-workspace-tasks node tests/organisation-workspace.browser.cjs || failed_suites="$failed_suites organisation-workspace.browser.cjs"
          PINTA_PREPARATION_OUT=/tmp/pinta-preparation-client-tasks node tests/browser-preparation-client.cjs || failed_suites="$failed_suites browser-preparation-client.cjs"
          npm run test:browser
          node tests/accessibility.cjs || failed_suites="$failed_suites accessibility.cjs"
          node tests/ux-team-browser.cjs || failed_suites="$failed_suites ux-team-browser.cjs"
          node tests/reception-concurrency.browser.cjs || failed_suites="$failed_suites reception-concurrency.browser.cjs"
          node tests/reception-devis.browser.cjs || failed_suites="$failed_suites reception-devis.browser.cjs"
          node tests/measurements-display.browser.cjs || failed_suites="$failed_suites measurements-display.browser.cjs"
          node tests/received-cartons.browser.cjs || failed_suites="$failed_suites received-cartons.browser.cjs"
          node tests/carton-numbering.browser.cjs || failed_suites="$failed_suites carton-numbering.browser.cjs"
          node tests/ux-devis.browser.cjs || failed_suites="$failed_suites ux-devis.browser.cjs"
          node tests/pdf-preview.browser.cjs || failed_suites="$failed_suites pdf-preview.browser.cjs"
          node tests/operations-simplicity.browser.cjs || failed_suites="$failed_suites operations-simplicity.browser.cjs"
          node tests/team-simplicity.browser.cjs || failed_suites="$failed_suites team-simplicity.browser.cjs"
          node tests/client-simplicity.browser.cjs || failed_suites="$failed_suites client-simplicity.browser.cjs"
          node tests/client-dossier-detail.browser.cjs || failed_suites="$failed_suites client-dossier-detail.browser.cjs"
          node tests/client-portal.browser.cjs || failed_suites="$failed_suites client-portal.browser.cjs"
          PINTA_SUBSCRIPTION_END_OUT=/tmp/pinta-subscription-end node tests/subscription-end.browser.cjs || failed_suites="$failed_suites subscription-end.browser.cjs"
          node tests/chat-retry.browser.cjs || failed_suites="$failed_suites chat-retry.browser.cjs"
          node tests/admin-simplicity.browser.cjs || failed_suites="$failed_suites admin-simplicity.browser.cjs"
          PINTA_CLIENT_PAGES_OUT=/tmp/pinta-client-pages node tests/client-pages.browser.cjs || failed_suites="$failed_suites client-pages.browser.cjs"
          PINTA_SETTINGS_DEVIS_OUT=/tmp/pinta-settings-devis node tests/settings-devis.browser.cjs || failed_suites="$failed_suites settings-devis.browser.cjs"
          if [ -n "$failed_suites" ]; then echo "Suites en échec :$failed_suites"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedile-verifications
          path: |
            /tmp/pinta-browser-results
            /tmp/pinta-accessibility-results
            /tmp/pinta-devis-results
            /tmp/pinta-team-results
            /tmp/pinta-pdf-results
            /tmp/pinta-reception-devis-results
            /tmp/pinta-received-cartons-results
            /tmp/pinta-carton-numbering-results
            /tmp/pinta-invoice-workspace-20260916
            /tmp/pinta-invoice-completion
            /tmp/pinta-invoice-quote-withdrawal
            /tmp/pinta-client-late-invoice
            /tmp/pinta-preparation-autonomous
            /tmp/pinta-quote-task-conflict
            /tmp/pinta-customs-quote
            /tmp/pinta-task-back-navigation
            /tmp/pinta-shipment-revision
            /tmp/pinta-task-flow
            /tmp/pinta-task-readiness
            /tmp/pinta-dossier-shell
            /tmp/pinta-parcours-dossier
            /tmp/pinta-dossier-overview
            /tmp/pinta-conversation-layout
            /tmp/pinta-conversations
            /tmp/pinta-reception-page
            /tmp/pinta-personal-work
            /tmp/pinta-work-layout
            /tmp/pinta-task-claim
            /tmp/pinta-collaborative-work
            /tmp/pinta-payment-return
            /tmp/pinta-dossier-list-contrast
            /tmp/pinta-dossier-table
            /tmp/pinta-dossier-table-comfort
            /tmp/pinta-dossier-departures
            /tmp/pinta-dossier-accords
            /tmp/pinta-departures-page
            /tmp/pinta-receipt-flow
            /tmp/pinta-client-lightweight
            /tmp/pinta-task-message
            /tmp/pinta-workspace-tasks
            /tmp/pinta-preparation-client-tasks
            /tmp/pinta-preview.log
            /tmp/pinta-operations-simplicity
            /tmp/pinta-team-simplicity
            /tmp/pinta-chat-retry
            /tmp/pinta-client-simplicity
            /tmp/pinta-client-dossier-detail
            /tmp/pinta-admin-simplicity
            /tmp/pinta-client-pages
            /tmp/pinta-settings-devis
